<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今晚吃什么 · 猫明之主</title>
  <meta name="description" content="中式饭菜智能生成器：输入已有食材推荐真实菜名，告诉你能不能马上做、还差什么。支持随机推荐、收藏、烹饪步骤。">
  <meta property="og:title" content="今晚吃什么 · 中式饭菜生成器">
  <meta property="og:description" content="输入已有食材推荐真实菜名，100+道家常菜，帮你决定今晚吃什么。">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2f6b45">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
  <style>
    :root {
      --ink: #18231d;
      --muted: #667168;
      --line: #d9ded5;
      --paper: #fbfaf4;
      --panel: #fffefa;
      --surface: #fff;
      --green: #2f6b45;
      --red: #b84733;
      --gold: #be842b;
      --blue: #315f72;
      --soft: #edf4ed;
      --soft-warm: #fff8ee;
      --shadow: 0 18px 48px rgba(32, 39, 34, .12);
      --shadow-sm: 0 4px 12px rgba(32, 39, 34, .06);
      --radius: 10px;
    }

    [data-theme="dark"] {
      --ink: #e8ede6;
      --muted: #99a89b;
      --line: #3a4a3c;
      --paper: #1a231c;
      --panel: #1e2a21;
      --surface: #243028;
      --soft: #263a2a;
      --soft-warm: #2e2a1e;
      --shadow: 0 18px 48px rgba(0, 0, 0, .35);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, .25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      transition: background .3s, color .3s;
    }

    button, textarea, select { font: inherit; color: inherit; }

    /* ── 顶部导航 ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .topbar a {
      color: var(--green);
      text-decoration: none;
      font-weight: 900;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar a:hover { opacity: .75; }
    .topbar .brand { font-size: 18px; color: var(--ink); }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .theme-btn, .fav-btn {
      width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--surface); cursor: pointer; font-size: 18px;
      display: grid; place-items: center; transition: .2s;
    }
    .theme-btn:hover, .fav-btn:hover { border-color: var(--green); }

    /* ── 主体 ── */
    .shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 60px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .sub {
      margin: 8px 0 0;
      max-width: 780px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }
    .stat {
      min-width: 130px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 16px;
      background: var(--surface);
      text-align: center;
      color: var(--muted);
    }
    .stat b {
      display: block;
      color: var(--green);
      font-size: 28px;
      line-height: 1.1;
    }

    main {
      display: grid;
      grid-template-columns: minmax(300px, 400px) 1fr;
      gap: 24px;
      margin-top: 24px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 20px;
      position: sticky;
      top: 72px;
    }

    .switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 16px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .switch button {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 900;
      font-size: 14px;
      transition: .2s;
    }
    .switch button.active {
      background: var(--green);
      color: #fff;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 900;
      font-size: 14px;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      padding: 12px 14px;
      line-height: 1.6;
      font-size: 14px;
    }
    select {
      min-height: 40px;
      padding: 8px 10px;
      font-size: 14px;
    }
    textarea:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(47,107,69,.14);
    }
    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .checks {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }
    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }
    .check input {
      width: 17px; height: 17px;
      accent-color: var(--green);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 44px 44px;
      gap: 8px;
      margin-top: 18px;
    }
    .primary, .icon-btn {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .16s, box-shadow .16s;
      font-weight: 900;
    }
    .primary {
      background: var(--green);
      color: white;
      box-shadow: 0 10px 24px rgba(47,107,69,.22);
      font-size: 15px;
    }
    .icon-btn {
      background: var(--soft);
      color: var(--green);
      font-size: 20px;
    }
    .primary:hover, .icon-btn:hover { transform: translateY(-1px); }
    .primary:active, .icon-btn:active { transform: translateY(0); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
    }

    /* ── 结果区域 ── */
    .result { min-height: 540px; overflow: hidden; }

    .decision {
      display: grid;
      grid-template-columns: 1.06fr .94fr;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .picked { padding: 28px; }
    .kicker {
      margin: 0 0 8px;
      color: var(--red);
      font-size: 13px;
      font-weight: 900;
    }
    h2 {
      margin: 0;
      font-size: clamp(30px, 5vw, 56px);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }
    .answer {
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 16px;
    }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }
    .badge.need { background: #fff1df; color: #9d5e17; }
    .badge.buy { background: #f7e5e0; color: var(--red); }
    [data-theme="dark"] .badge.need { background: #3d2a14; color: #e8a740; }
    [data-theme="dark"] .badge.buy { background: #3d1a1a; color: #e07060; }

    .cover {
      min-height: 280px;
      display: grid;
      place-items: center;
      border-left: 1px solid var(--line);
      background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.72), transparent 33%),
                  linear-gradient(135deg, #e7efe2, #efd29b 58%, #cc5741);
    }
    [data-theme="dark"] .cover {
      background: radial-gradient(circle at 30% 28%, rgba(40,50,40,.7), transparent 33%),
                  linear-gradient(135deg, #2a3a28, #4a3820 58%, #5a2820);
    }
    .plate {
      width: min(240px, 72%);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fffdf7;
      box-shadow: inset 0 0 0 14px #ece6d8, 0 20px 38px rgba(63,45,29,.18);
      position: relative;
    }
    [data-theme="dark"] .plate {
      background: #2a2a22;
      box-shadow: inset 0 0 0 14px #3a3a30, 0 20px 38px rgba(0,0,0,.3);
    }
    .plate::before, .plate::after {
      content: ""; position: absolute; border-radius: 999px;
    }
    .plate::before {
      width: 48%; height: 30%; left: 24%; top: 27%;
      background: var(--dish-color, #bd4737);
      box-shadow: 38px 38px 0 -10px var(--dish-accent, #2f6b45), -18px 58px 0 -12px #d6a13a;
      transform: rotate(-13deg);
    }
    .plate::after {
      width: 54%; height: 12px; left: 23%; bottom: 26%;
      background: rgba(23,33,27,.18); filter: blur(8px);
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .meta div {
      padding: 16px 18px;
      border-right: 1px solid var(--line);
    }
    .meta div:last-child { border-right: 0; }
    .meta b { display: block; margin-bottom: 6px; font-size: 14px; }
    .meta span { color: var(--muted); line-height: 1.65; font-size: 13px; }

    /* ── 烹饪步骤 ── */
    .steps-section {
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }
    .steps-section h3 { margin: 0 0 12px; font-size: 17px; }
    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.6;
    }
    .step-num {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 12px;
    }
    .step small { color: var(--muted); }

    /* ── 候选列表 ── */
    .list { padding: 20px; }
    .list-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }
    .list-head h3 { margin: 0; font-size: 17px; }
    .list-head span { color: var(--muted); font-size: 13px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .card {
      min-height: 120px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: .2s;
    }
    .card:hover {
      border-color: rgba(47,107,69,.55);
      box-shadow: var(--shadow-sm);
    }
    .card b { display: block; line-height: 1.45; overflow-wrap: anywhere; font-size: 14px; }
    .card small { color: var(--muted); line-height: 1.55; font-size: 12px; }
    .card .fav-star {
      align-self: flex-end;
      color: var(--gold);
      font-size: 14px;
      cursor: pointer;
      z-index: 2;
    }

    .empty {
      padding: 36px;
      color: var(--muted);
      line-height: 1.8;
    }
    .empty h2 { color: var(--ink); font-size: clamp(24px, 4vw, 38px); }

    /* ── 收藏弹窗 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      place-items: center;
    }
    .modal-overlay.open { display: grid; }
    .modal {
      width: min(560px, 90vw);
      max-height: 70vh;
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 24px;
      overflow-y: auto;
    }
    .modal h3 { margin: 0 0 12px; }
    .modal-close {
      float: right;
      border: 0; background: none;
      font-size: 22px; cursor: pointer;
      color: var(--muted);
    }
    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .fav-item button {
      border: 0; background: none; cursor: pointer;
      color: var(--red); font-size: 14px;
    }
    .fav-empty { color: var(--muted); padding: 20px 0; text-align: center; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--paper);
      padding: 10px 22px; border-radius: 999px;
      font-size: 14px; font-weight: 900;
      z-index: 200; opacity: 0; transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 880px) {
      header, main, .decision, .meta { grid-template-columns: 1fr; }
      .controls { position: static; }
      .cover { border-left: 0; border-top: 1px solid var(--line); min-height: 200px; }
      .meta div { border-right: 0; border-bottom: 1px solid var(--line); }
      .meta div:last-child { border-bottom: 0; }
    }
    @media (max-width: 520px) {
      .shell { width: min(100% - 16px, 1200px); padding-top: 12px; }
      .row, .actions { grid-template-columns: 1fr; }
      .picked { padding: 20px; }
      .steps { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- 顶部导航栏 -->
<div class="topbar">
  <a href="index.html">← 返回小站</a>
  <span class="brand">🍳 今晚吃什么</span>
  <div class="topbar-actions">
    <button class="fav-btn" id="favBtn" title="我的收藏" aria-label="我的收藏">⭐</button>
    <button class="theme-btn" id="themeBtn" title="切换主题" aria-label="切换暗色/亮色模式">🌙</button>
  </div>
</div>

<div class="shell">
  <header>
    <div>
      <h1>今晚吃什么</h1>
      <p class="sub">输入你手头的食材，推荐真实菜名并告诉你能不能马上做、还差什么。100+ 道中式家常菜，涵盖下饭菜、主食、汤羹、凉菜。不输入也能一键拍板。</p>
    </div>
    <div class="stat"><b id="dishCount">0</b>道真实菜名</div>
  </header>

  <main>
    <section class="panel controls">
      <div class="switch" aria-label="生成模式">
        <button id="modeIngredient" class="active" type="button">按食材推荐</button>
        <button id="modeRandom" type="button">随便来一道</button>
      </div>

      <div id="ingredientBox">
        <label for="ingredients">你现在有什么</label>
        <textarea id="ingredients" placeholder="例如：鸡蛋、土豆、猪肉、米饭"></textarea>
        <p class="hint">只输入"鸡蛋"也可以，会推荐西红柿炒鸡蛋、韭黄炒蛋等，并标出需要补买什么。</p>
      </div>

      <div class="row">
        <div>
          <label for="category">想吃类型</label>
          <select id="category">
            <option value="">不限</option>
            <option value="菜">下饭菜</option>
            <option value="主食">主食</option>
            <option value="汤">汤羹</option>
            <option value="凉菜">凉菜</option>
            <option value="小食">小吃点心</option>
          </select>
        </div>
        <div>
          <label for="effort">做饭状态</label>
          <select id="effort">
            <option value="">都行</option>
            <option value="快手">只想快点吃</option>
            <option value="家常">正常做一顿</option>
            <option value="费点工夫">今天有耐心</option>
          </select>
        </div>
      </div>

      <div class="checks">
        <label class="check"><input id="allowBuy" type="checkbox" checked> 允许补买 1-2 样关键食材</label>
        <label class="check"><input id="preferReady" type="checkbox" checked> 优先推荐现在就能做的</label>
      </div>

      <div class="actions">
        <button class="primary" id="decide" type="button">帮我决定</button>
        <button class="icon-btn" id="again" type="button" title="换一道" aria-label="换一道">↻</button>
        <button class="icon-btn" id="favAdd" type="button" title="收藏这道菜" aria-label="收藏">♡</button>
      </div>

      <div class="chips" id="chips"></div>
    </section>

    <section class="panel result" aria-live="polite" id="result"></section>
  </main>
</div>

<!-- 收藏弹窗 -->
<div class="modal-overlay" id="favModal">
  <div class="modal">
    <button class="modal-close" onclick="closeFavModal()">✕</button>
    <h3>⭐ 我的收藏</h3>
    <div id="favList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  数据层
// ══════════════════════════════════════════

const aliases = new Map(Object.entries({
  "番茄":"西红柿","洋芋":"土豆","马铃薯":"土豆","青椒":"辣椒","尖椒":"辣椒",
  "杭椒":"辣椒","卷心菜":"包菜","圆白菜":"包菜","小白菜":"白菜","娃娃菜":"白菜",
  "油菜":"青菜","小青菜":"青菜","上海青":"青菜","瘦肉":"猪肉","肉丝":"猪肉",
  "肉片":"猪肉","肉末":"猪肉","五花":"五花肉","鸡肉":"鸡腿肉","鸡胸":"鸡胸肉",
  "米":"大米","剩饭":"米饭","白饭":"米饭","挂面":"面条","面":"面条",
  "红薯粉":"粉丝","粉条":"粉丝","香葱":"葱","大葱":"葱","鸡蛋":"鸡蛋",
  "青瓜":"黄瓜","西兰花":"西兰花","花菜":"花菜","菜花":"花菜","圆椒":"甜椒",
  "生粉":"淀粉","姜":"姜","蒜":"蒜","干辣椒":"辣椒"
}));

const pantry = ["油","盐","糖","酱油","生抽","老抽","醋","料酒","淀粉","葱","姜","蒜","辣椒","花椒","胡椒粉","蚝油","香油","豆瓣酱","鸡精","味精"];

// 菜品数据库 — 120 道
const dishes = [
  // ══ 蛋类 ══

  { name:"酒酿圆子", type:"小食", effort:"快手", time:"15分钟", mains:["糯米粉","酒酿"], optional:["枸杞","桂花"], taste:"甜香", staple:"单吃", reason:"想吃甜的，酒酿圆子很温柔。", steps:["糯米粉加水揉成小圆子","水开下圆子煮至浮起","加酒酿枸杞煮1分钟"] },
  { name:"馒头", type:"主食", effort:"费点工夫", time:"90分钟", mains:["面粉","酵母"], optional:[], taste:"麦香", staple:"单吃", reason:"愿意发面就自己做馒头。", steps:["酵母用温水化开加入面粉揉成面团","发酵1小时至2倍大","揉面排气分成剂子，二次发酵20分钟后蒸15分钟"] }
];

const colors = [
  ["#bd4737","#2f6b45"],["#d59b30","#315f72"],["#7f3f2d","#d4b04b"],
  ["#2e7566","#c94d3a"],["#9d4339","#6f934f"],["#c06030","#3f6f50"],
  ["#a04030","#4a7060"],["#d08030","#2f5060"]
];

// ══════════════════════════════════════════
//  状态管理
// ══════════════════════════════════════════

const state = { mode:"ingredients", candidates:[], picked:null, colorIdx:0 };
const $ = (id) => document.getElementById(id);
$("dishCount").textContent = dishes.length;

function normalize(value) {
  const item = value.trim().replace(/[，。；;、]/g,"");
  return aliases.get(item) || item;
}

function parseIngredients() {
  return [...new Set($("ingredients").value.split(/[\s,，、;；\n\r]+/).map(normalize).filter(Boolean))];
}

function allHave() {
  return [...new Set([...parseIngredients(), ...pantry])];
}

// ══════════════════════════════════════════
//  收藏管理 (localStorage)
// ══════════════════════════════════════════

function getFavorites() {
  try { return JSON.parse(localStorage.getItem("eat_favorites") || "[]"); }
  catch { return []; }
}

function saveFavorites(list) {
  localStorage.setItem("eat_favorites", JSON.stringify(list));
}

function isFavorite(name) {
  return getFavorites().includes(name);
}

function toggleFavorite(name) {
  const favs = getFavorites();
  const idx = favs.indexOf(name);
  if (idx >= 0) { favs.splice(idx, 1); showToast("已取消收藏"); }
  else { favs.push(name); showToast("已加入收藏 ⭐"); }
  saveFavorites(favs);
  updateFavBtn();
  render();
}

// ══════════════════════════════════════════
//  历史记录
// ══════════════════════════════════════════

function getHistory() {
  try { return JSON.parse(localStorage.getItem("eat_history") || "[]"); }
  catch { return []; }
}

function addHistory(dish) {
  const hist = getHistory().filter(h => h.name !== dish.name);
  hist.unshift({ name: dish.name, time: Date.now() });
  localStorage.setItem("eat_history", JSON.stringify(hist.slice(0, 20)));
}

// ══════════════════════════════════════════
//  核心逻辑
// ══════════════════════════════════════════

function setMode(mode) {
  state.mode = mode;
  $("modeIngredient").classList.toggle("active", mode === "ingredients");
  $("modeRandom").classList.toggle("active", mode === "random");
  $("ingredientBox").hidden = mode !== "ingredients";
  updateChips();
}

function scoreDish(dish) {
  const userItems = parseIngredients();
  const have = allHave();
  const category = $("category").value;
  const effort = $("effort").value;
  const allowBuy = $("allowBuy").checked;
  const preferReady = $("preferReady").checked;

  if (category && dish.type !== category) return null;
  if (effort && dish.effort !== effort) return null;

  const haveMains = dish.mains.filter(item => have.includes(item));
  const missing = dish.mains.filter(item => !have.includes(item));
  const optionalHits = dish.optional.filter(item => have.includes(item));
  const touchesUserInput = userItems.length === 0 || dish.mains.some(item => userItems.includes(item)) || dish.optional.some(item => userItems.includes(item));

  if (state.mode === "ingredients" && userItems.length && !touchesUserInput) return null;
  if (state.mode === "ingredients" && missing.length && !allowBuy) return null;
  if (state.mode === "ingredients" && missing.length > 2) return null;

  let score = 10;
  score += haveMains.length * 9;
  score += optionalHits.length * 2;
  score -= missing.length * 5;
  if (preferReady && missing.length === 0) score += 12;
  if (dish.effort === "快手") score += 2;
  score += Math.random() * 4;

  return { ...dish, haveMains, missing, optionalHits, score };
}

function decide() {
  const scored = dishes.map(scoreDish).filter(Boolean).sort((a, b) => b.score - a.score);
  state.candidates = weightedShuffle(scored).slice(0, 12);
  state.picked = state.candidates[0] || null;
  state.colorIdx = (state.colorIdx + 1) % colors.length;
  if (state.picked) addHistory(state.picked);
  render();
  updateChips();
}

function weightedShuffle(list) {
  return [...list].sort((a, b) => {
    const jitterA = Math.log(Math.random()) / Math.max(1, a.score);
    const jitterB = Math.log(Math.random()) / Math.max(1, b.score);
    return jitterB - jitterA;
  });
}

function again() {
  if (!state.candidates.length) { decide(); return; }
  const index = state.candidates.findIndex(item => item.name === state.picked?.name);
  state.picked = state.candidates[(index + 1) % state.candidates.length];
  state.colorIdx = (state.colorIdx + 1) % colors.length;
  if (state.picked) addHistory(state.picked);
  render();
}

function pickDish(name) {
  state.picked = state.candidates.find(item => item.name === name) || state.picked;
  if (state.picked) addHistory(state.picked);
  render();
}

// ══════════════════════════════════════════
//  渲染
// ══════════════════════════════════════════

function render() {
  const dish = state.picked;
  if (!dish) {
    $("result").innerHTML = `<div class="empty"><h2>暂时没匹配到</h2><p>减少筛选条件，或者允许补买 1-2 样关键食材。</p></div>`;
    updateFavBtn();
    return;
  }

  const ready = dish.missing.length === 0;
  const color = colors[state.colorIdx];
  const buyText = ready ? "不用补买" : dish.missing.join("、");
  const haveText = dish.haveMains.length ? dish.haveMains.join("、") : "未输入相关食材";
  const others = state.candidates.filter(item => item.name !== dish.name).slice(0, 8);
  const headline = ready ? "今晚就吃这个" : "今晚吃这个，顺手补点料";
  const fav = isFavorite(dish.name);
  const stepsHtml = dish.steps ? dish.steps.map((s, i) =>
    `<div class="step"><span class="step-num">${i + 1}</span><small>${escapeHtml(s)}</small></div>`
  ).join("") : "";

  $("result").innerHTML = `
    <div class="decision">
      <div class="picked">
        <p class="kicker">${headline}</p>
        <h2>${escapeHtml(dish.name)} <span style="cursor:pointer;font-size:24px" onclick="toggleFavorite('${escapeHtml(dish.name).replace(/'/g, "&#039;")}')">${fav ? "⭐" : "☆"}</span></h2>
        <div class="badges">
          <span class="badge">${dish.type}</span>
          <span class="badge">${dish.effort}</span>
          <span class="badge">${dish.time}</span>
          <span class="badge need">${dish.taste}</span>
          ${ready ? '<span class="badge">现在能做</span>' : `<span class="badge buy">需补买：${escapeHtml(buyText)}</span>`}
        </div>
        <p class="answer">${escapeHtml(dish.reason)} 我的决定是：别再纠结了，今晚就吃 <strong>${escapeHtml(dish.name)}</strong>。</p>
      </div>
      <div class="cover" style="--dish-color:${color[0]};--dish-accent:${color[1]}">
        <div class="plate" aria-hidden="true"></div>
      </div>
    </div>
    <div class="meta">
      <div><b>你已经有</b><span>${escapeHtml(haveText)}</span></div>
      <div><b>还差什么</b><span>${escapeHtml(buyText)}</span></div>
      <div><b>搭配建议</b><span>${escapeHtml(dish.staple)}</span></div>
    </div>
    ${dish.steps ? `
    <div class="steps-section">
      <h3>📝 做法步骤</h3>
      <div class="steps">${stepsHtml}</div>
    </div>` : ""}
    <div class="list">
      <div class="list-head">
        <h3>不服可以换</h3>
        <span>${state.candidates.length} 个候选</span>
      </div>
      <div class="cards">
        ${others.map(item => {
          const itemFav = isFavorite(item.name);
          const star = itemFav ? "⭐" : "☆";
          return `
          <article class="card" tabindex="0" data-name="${escapeHtml(item.name)}">
            <div>
              <b>${escapeHtml(item.name)}</b>
              <small>${item.missing.length ? "需补买：" + escapeHtml(item.missing.join("、")) : "现在能做"} · ${item.effort} · ${item.time}</small>
            </div>
            <small>${escapeHtml(item.reason)}</small>
            <span class="fav-star" data-fav="${escapeHtml(item.name)}">${star}</span>
          </article>`;
        }).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".card").forEach(card => {
    const activate = () => pickDish(card.dataset.name);
    card.addEventListener("click", e => {
      if (e.target.closest(".fav-star")) {
        toggleFavorite(e.target.closest(".fav-star").dataset.fav);
        return;
      }
      activate();
    });
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); activate(); }
    });
  });

  updateFavBtn();
}

function updateChips() {
  const items = state.mode === "ingredients" ? parseIngredients() : [];
  const extras = [$("category").selectedOptions[0].textContent, $("effort").selectedOptions[0].textContent]
    .filter(item => item && item !== "不限" && item !== "都行");
  const chips = [...items, ...extras];
  $("chips").innerHTML = chips.length
    ? chips.map(item => `<span class="chip">${escapeHtml(item)}</span>`).join("")
    : '<span class="chip">不输入也能直接决定</span>';
}

function updateFavBtn() {
  const dish = state.picked;
  $("favAdd").textContent = dish && isFavorite(dish.name) ? "★" : "♡";
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove("show"), 1600);
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

// ══════════════════════════════════════════
//  收藏弹窗
// ══════════════════════════════════════════

function renderFavModal() {
  const favs = getFavorites();
  const list = $("favList");
  if (!favs.length) {
    list.innerHTML = '<div class="fav-empty">还没收藏任何菜，点击菜名旁边的 ☆ 即可收藏</div>';
    return;
  }
  list.innerHTML = favs.map(name => {
    const dish = dishes.find(d => d.name === name);
    if (!dish) return "";
    return `<div class="fav-item">
      <span><strong>${escapeHtml(dish.name)}</strong> · ${dish.type} · ${dish.effort} · ${dish.time}</span>
      <button onclick="toggleFavorite('${escapeHtml(dish.name).replace(/'/g, "&#039;")}');renderFavModal()">删除</button>
    </div>`;
  }).join("");
}

function openFavModal() {
  renderFavModal();
  $("favModal").classList.add("open");
}

function closeFavModal() {
  $("favModal").classList.remove("open");
}

$("favModal").addEventListener("click", e => {
  if (e.target === $("favModal")) closeFavModal();
});

// ══════════════════════════════════════════
//  暗色主题
// ══════════════════════════════════════════

function initTheme() {
  const saved = localStorage.getItem("eat_theme") || "light";
  applyTheme(saved);
}

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("eat_theme", t);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current === "dark" ? "light" : "dark");
}

// ══════════════════════════════════════════
//  事件绑定
// ══════════════════════════════════════════

$("modeIngredient").addEventListener("click", () => setMode("ingredients"));
$("modeRandom").addEventListener("click", () => setMode("random"));
$("decide").addEventListener("click", decide);
$("again").addEventListener("click", again);
$("favAdd").addEventListener("click", () => {
  if (state.picked) toggleFavorite(state.picked.name);
});
$("favBtn").addEventListener("click", openFavModal);
$("themeBtn").addEventListener("click", toggleTheme);

["ingredients","category","effort","allowBuy","preferReady"].forEach(id => {
  $(id).addEventListener("input", updateChips);
  $(id).addEventListener("change", () => { updateChips(); if (state.picked) decide(); });
});

// ══════════════════════════════════════════
//  初始化
// ══════════════════════════════════════════

initTheme();
$("ingredients").value = "鸡蛋";
updateChips();
decide();
</script>
