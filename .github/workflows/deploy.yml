name: Deploy Astro to GitHub Pages

# ============================================================
# 猫明之主小站 · Astro SSG → GitHub Pages
# 触发: push main 分支 / 手动 / 每日定时 (北京时间 8:30)
# ============================================================

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 北京时间 8:30 = UTC 0:30 (给内容生成留 30 分钟窗口)
    - cron: '30 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
